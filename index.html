<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Touch</title>
<style>
body {
  background: #111;
  color: white;
  font-family: Arial;
  text-align: center;
}
.controles {
  position: fixed;
  bottom: 25px;
  width: 100%;
  display: flex;
  justify-content: space-around;
}
button {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #444;
  color: white;
  border: 2px solid white;
  font-size: 20px;
  opacity: 0.8;
}
</style>
</head>
<body>
<h2>Overlay Touch</h2>
<div class="controles">
<button>↑</button>
<button>←</button>
<button>↓</button>
<button>→</button>
<button>A</button>
</div>
</body>
</html>
